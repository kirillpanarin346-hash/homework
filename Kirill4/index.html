<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>практика по формам</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <form>
        <fieldset>
            <legend>Ваши личные данные</legend>
            
            <label for="name">Ваше имя</label>
            <input type="text" id="name" placeholder="Имя">
            
            <label for="age">Ваш возраст</label>
            <input type="text" id="age" placeholder="Возраст">
            
            <label for="phone">Ваш номер телефона</label>
            <input type="text" id="phone" placeholder="Номер телефона">
            
            <label for="email">Ваша почта</label>
            <input type="text" id="email" placeholder="Почта">
            
            <label for="message">Сообщение</label>
            <textarea id="message" rows="4" placeholder="Ваше сообщение"></textarea>
            
            <div class="checkbox-label">
                <input type="checkbox" id="terms">
                <label for="terms">Я принимаю правила</label>
            </div>
            
            <button type="submit">Отправить</button>
        </fieldset>
    </form>
</div>

</body>
</html>
